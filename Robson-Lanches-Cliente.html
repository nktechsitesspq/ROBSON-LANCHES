/* acabamento premium: reflexo bonito e leve, sempre preso ao próprio elemento */
@keyframes slowReflection{
  0%{left:-45%;opacity:0}
  8%{left:-30%;opacity:.10}
  50%{left:65%;opacity:.42}
  88%{left:145%;opacity:.10}
  100%{left:160%;opacity:0}
}
@keyframes cardReflectionContinuous{
  0%{left:-45%;opacity:0}
  8%{left:-30%;opacity:.10}
  50%{left:65%;opacity:.42}
  88%{left:145%;opacity:.10}
  100%{left:160%;opacity:0}
}
@keyframes softGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.045)}}

/* Cada reflexo fica CLIPADO no elemento onde deve aparecer.
   Logo = somente nas letras; botões = somente dentro do botão. */
.brand b,.brand span,.heroBtns .btn,.status,.card{position:relative;overflow:hidden}
.brand b::after,.brand span::after,.heroBtns .btn::after,.status::after,.card::after{
  content:"";
  position:absolute;
  top:-45%;
  left:-45%;
  width:32%;
  height:190%;
  pointer-events:none;
  background:linear-gradient(112deg,transparent 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,.48) 50%,rgba(255,255,255,.08) 57%,transparent 72%);
  transform:skewX(-18deg);
  animation:slowReflection 5.5s cubic-bezier(.35,0,.2,1) infinite;
  will-change:left,opacity;
}
.brand b::after{animation-delay:.35s}
.brand span::after{animation-delay:1.05s}
.heroBtns .btn:nth-child(1)::after{animation-delay:.2s}
.heroBtns .btn:nth-child(2)::after{animation-delay:1.1s}
.status::after{animation-delay:1.8s}
.card::after{animation-duration:6.2s;animation-delay:2.2s}
.productPhoto{position:relative}
.card{animation:none}
@media(prefers-reduced-motion:reduce){.brand b::after,.brand span::after,.heroBtns .btn::after,.status::after,.card::after,.card{animation:none!important;filter:none!important}}

<style id="reflexo-card-final">

  92%{opacity:.12}
  100%{left:150%;opacity:0}

  content:"";

function finishOrder(){
  if(!cart.length){orderToast('Adicione um lanche primeiro');return}
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.replace(/\D/g,'');
  const pay=document.querySelector('input[name=pay]:checked')?.value||'';
  const del=document.getElementById('delivery').value;
  const address=document.getElementById('address').value.trim();
  const bairro=document.getElementById('neighborhood').value;
  const note=document.getElementById('note').value.trim();
  if(!name){orderToast('Nome é obrigatório. Preencha seu nome.');document.getElementById('name').focus();return}
  if(phone.length!==11){orderToast('Número de telefone incorreto. Digite os 11 números.');document.getElementById('phone').focus();return}
  if(!pay){orderToast('Forma de pagamento é obrigatória. Escolha PIX, dinheiro ou cartão.');document.querySelector('.pay input')?.focus();return}
  let changeNeed='', changeValue='', numeric=NaN;
  if(pay==='Dinheiro'){
    changeNeed=document.querySelector('input[name=changeNeed]:checked')?.value||'';
    if(!changeNeed){orderToast('Troco é obrigatório. Informe se precisa de troco.');document.querySelector('input[name=changeNeed]')?.focus();return}
    if(changeNeed==='Sim'){
      changeValue=document.getElementById('changeValue').value.trim();
      numeric=Number(changeValue.replace(/[^0-9,]/g,'').replace(/\./g,'').replace(',','.'));
      if(!changeValue || !Number.isFinite(numeric)){orderToast('Troco é obrigatório. Informe o valor para o qual precisa de troco.');document.getElementById('changeValue').focus();return}
      let subtotalCheck=cart.reduce((sum,i)=>sum+products.find(p=>p.id===i.id).price*i.q,0);
      const feeCheck=del==='Entrega'?getDeliveryFee():0;
      const totalCheck=subtotalCheck+feeCheck;
      if(numeric<totalCheck){orderToast('O valor para troco precisa ser maior ou igual ao total do pedido.');document.getElementById('changeValue').focus();return}
    }
  }
  if(!del){orderToast('Entrega ou retirada é obrigatório. Escolha uma opção.');document.getElementById('delivery').focus();return}
  if(del==='Entrega'){
    if(localStorage.getItem('robson_lanches_moto')==='false'){orderToast('Entrega indisponível no momento. Escolha retirada.');document.getElementById('delivery').focus();return}
    if(!bairro){orderToast('Bairro é obrigatório. Selecione seu bairro.');document.getElementById('neighborhood').focus();return}
    if(!address){orderToast('Endereço é obrigatório. Preencha o endereço para entrega.');document.getElementById('address').focus();return}
  }
  let subtotal=cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.q,0),fee=del==='Entrega'?getDeliveryFee():0,total=subtotal+fee;
  let lines=cart.map(i=>{let p=products.find(x=>x.id===i.id);return `${i.q}x ${p.name} - ${money(p.price*i.q)}`}).join('%0A');
  let msg=`*ROBSON LANCHES*%0A%0A${lines}%0A%0ASubtotal: ${money(subtotal)}`+(fee?`%0ATaxa de entrega: ${money(fee)}`:'')+`%0A%0A*Total: ${money(total)}*%0A%0ANome: ${encodeURIComponent(name)}%0ATelefone: ${phone}%0APagamento: ${pay}`+(pay==='Dinheiro'?`%0ATroco: ${changeNeed==='Sim'?'SIM — para '+encodeURIComponent(money(numeric)):'NÃO'}`:'')+`%0AEntrega: ${del}`+(bairro?`%0ABairro: ${encodeURIComponent(bairro)}`:'')+(address?`%0AEndereço: ${encodeURIComponent(address)}`:'')+(note?`%0AObservação: ${encodeURIComponent(note)}`:'');
  let wa=localStorage.getItem('robson_lanches_whatsapp')||'5515996451252';
  if(!wa)return orderToast('Configure o WhatsApp no ADM');
  window.open('https://wa.me/'+wa+'?text='+msg,'_blank')
}
